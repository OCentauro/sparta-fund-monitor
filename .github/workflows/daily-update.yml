/* 
  SCRIPT DE DEBUG - Versão temporária para diagnosticar scraping
*/
import { initializeApp } from "firebase/app";
import { getFirestore, doc, setDoc, getDoc } from "firebase/firestore";
const firebaseConfig = {
  apiKey: process.env.FIREBASE_API_KEY,
  authDomain: process.env.FIREBASE_AUTH_DOMAIN,
  projectId: process.env.FIREBASE_PROJECT_ID,
  storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
  messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
  appId: process.env.FIREBASE_APP_ID
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app); 
const FUNDS_CONFIG = [
  { ticker: 'JURO11', url: 'https://www.sparta.com.br/sparta-fi-infra/' },
  { ticker: 'DIVS11', url: 'https://www.sparta.com.br/divs11/' },
  { ticker: 'CRAA11', url: 'https://www.sparta.com.br/craa11/' },
  { ticker: 'CDII11', url: 'https://www.sparta.com.br/sparta-cdii11/' },
  { ticker: 'MXRF11', url: 'https://www.xpasset.com.br/fundos/maxi-renda/' }
];
async function debugExtractCotaPatrimonial(url, ticker) {
  try {
    console.log(`\n🔍 [DEBUG] Acessando: ${url}`);
    
    const response = await fetch(url, {
      headers: { 
        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
        "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8",
        "Accept-Language": "pt-BR,pt;q=0.9,en-US;q=0.8,en;q=0.7"
      },
      redirect: 'follow'
    });
    
    console.log(`📡 Status HTTP: ${response.status} ${response.statusText}`);
    console.log(`📍 URL final: ${response.url}`);
    
    if (!response.ok) {
      console.log(`❌ Erro HTTP: ${response.status}`);
      return null;
    }
    
    const html = await response.text();
    console.log(`📄 Tamanho do HTML: ${html.length} caracteres`);
    
    // Mostra os primeiros 3000 caracteres para análise
    console.log(`\n📋 [PRIMEIROS 3000 CARACTERES DO HTML]:`);
    console.log(html.substring(0, 3000));
    console.log(`\n... (truncado) ...\n`);
    
    // Tenta múltiplas regex patterns
    const regexes = [
      { name: 'Cota Patrimonial com pipe', pattern: /Cota Patrimonial[\s\S]{0,150}\|\s*([0-9]{2,3}[.,][0-9]{2})/i },
      { name: 'Cota Patrimonial simples', pattern: /Cota Patrimonial[\s\S]{0,150}([0-9]{2,3}[.,][0-9]{2})/i },
      { name: 'Valor Patrimonial', pattern: /Valor Patrimonial[\s\S]{0,150}R?\$\s*([0-9]{2,3}[.,][0-9]{2})/i },
      { name: 'Cota de Fechamento', pattern: /Cota de Fechamento[\s\S]{0,150}([0-9]{2,3}[.,][0-9]{2})/i },
      { name: 'Cota Patrimonial R$', pattern: /Cota Patrimonial[\s\S]{0,100}R\$\s*([0-9]{2,3}[.,][0-9]{2})/i },
      { name: 'VP genérico', pattern: /VP[\s\S]{0,50}R\$\s*([0-9]{2,3}[.,][0-9]{2})/i }
    ];
    
    console.log(`\n🔎 [TESTANDO REGEX PATTERNS]:`);
    for (const regex of regexes) {
      const match = html.match(regex.pattern);
      if (match && match[1]) {
        const val = parseFloat(match[1].replace(",", "."));
        console.log(`✅ Pattern "${regex.name}" encontrou: ${match[1]} (valor: ${val})`);
        if (!isNaN(val) && val > 0) {
          return val;
        }
      } else {
        console.log(`❌ Pattern "${regex.name}" não encontrou match`);
      }
    }
    
    // Verifica se é SPA (página vazia ou com pouco conteúdo)
    if (html.length < 5000) {
      console.log(`⚠️ HTML muito pequeno (${html.length} chars) - possível SPA ou bloqueio`);
    }
    
    // Verifica se há JavaScript renderizando conteúdo
    if (html.includes('id="root"') || html.includes('id="app"')) {
      console.log(`⚠️ Detectado possível SPA (React/Vue) - conteúdo renderizado via JS`);
    }
    
    return null;
  } catch (error) {
    console.error(`❌ Erro ao buscar ${ticker}:`, error.message);
    return null;
  }
}
async function runDebug() {
  console.log(" [MODO DEBUG] Iniciando diagnóstico de scraping...\n");
  
  for (const fund of FUNDS_CONFIG) {
    console.log(`\n${'='.repeat(60)}`);
    console.log(` Fund: ${fund.ticker}`);
    console.log('='.repeat(60));
    
    const result = await debugExtractCotaPatrimonial(fund.url, fund.ticker);
    
    if (result !== null) {
      console.log(`\n✅ [SUCESSO] ${fund.ticker}: R$ ${result.toFixed(2)}`);
    } else {
      console.log(`\n❌ [FALHA] ${fund.ticker}: Não foi possível extrair`);
    }
    
    // Pausa de 2 segundos entre requisições para não sobrecarregar
    await new Promise(resolve => setTimeout(resolve, 2000));
  }
  
  console.log(`\n${'='.repeat(60)}`);
  console.log(" [DEBUG] Processo finalizado.");
  console.log('='.repeat(60));
}
runDebug().catch(console.error);
