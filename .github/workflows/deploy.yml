# .github/workflows/deploy.yml
# Deploy para GitHub Pages usando peaceiris (gh-pages branch)
# Gera token.js com a chave BRAPIDEV_TOKEN antes do deploy

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔑 Gerar arquivo token.js com a chave da Brapi
        run: |
          echo "window.BRAPIDEV_TOKEN = '${{ secrets.BRAPIDEV_TOKEN }}';" > token.js

      - name: 🚀 Deploy para a branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          user_name: "Sparta Bot"
          user_email: "bot@sparta-app.local"
          commit_message: "🤖 Deploy automático para GitHub Pages [skip ci]"
