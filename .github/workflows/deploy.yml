# .github/workflows/deploy.yml
# Deploy para GitHub Pages via branch gh-pages (peaceiris)

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Inject API Token
        run: |
          echo "window.BRAPIDEV_TOKEN = '${{ secrets.BRAPIDEV_TOKEN }}';" > token.js

      - name: 🚀 Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          user_name: "Sparta Bot"
          user_email: "bot@sparta-app.local"
          commit_message: "🤖 Deploy automático [skip ci]"