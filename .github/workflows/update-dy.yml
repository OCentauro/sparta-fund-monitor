# .github/workflows/update-dy.yml
# Extrai Dividend Yield dos fundos Sparta via Power BI (Playwright)
# Fonte: Portal do Cotista Sparta
# Cache do Chromium para execuções mais rápidas

name: 🤖 Atualizar DY automático

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

jobs:
  update-dy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 📦 Dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgbm1 libasound2 libnss3 libxkbcommon0

      - name: 📦 Instalar Playwright
        run: pip install playwright

      - name: ♻️ Cache do Chromium
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: 🌐 Instalar Chromium (se não em cache)
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
        timeout-minutes: 5

      - name: 🏷️ Extrair DY do Power BI
        id: extrair-dy
        run: python scripts/update_dy.py
        continue-on-error: true
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

      - name: ⚠️ Alerta se falhou
        if: steps.extrair-dy.outcome != 'success'
        run: echo "⚠️ Power BI não respondeu. DY não extraído."